<!DOCTYPE html>
<html lang="mr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ऋतु सजग · Rutu Sajag</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#1f4f4b;--g2:#e6efec;--cream:#faf5ec;--red:#c1452d;--dred:#7a1f15;--amb:#e0a526;--ink:#231f1a;--mut:#7b7367;--line:#e8dfcc;--bg:#e9e3d6;--w:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1916}}
:root[data-theme="dark"]{--bg:#1b1916}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);font-family:'Noto Sans Devanagari','Nirmala UI',Mukta,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.dev{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:6px}
.dev button{font-family:inherit;font-weight:600;font-size:12px;border:1px solid #b9ae98;background:transparent;color:var(--mut);padding:5px 10px;border-radius:99px;cursor:pointer}
.dev button.on{background:var(--g);color:#fff;border-color:var(--g)}
@media(max-width:480px){.dev{display:none}}
.ph{width:min(100%,392px);height:min(100%,800px);background:var(--cream);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 2px 0 #00000014,0 12px 30px #0003}
@media(max-width:480px){.ph{border-radius:0;height:100%;width:100%}}
.scr{flex:1;overflow-y:auto;padding:0 18px 16px}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* onboarding */
.hd{background:var(--g);color:#fff;padding:26px 20px 18px;margin:0 -18px}
.brand{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:800}
.hd p{font-size:14px;color:#cfe0dc;margin:6px 0 14px}
.chips{display:flex;gap:8px}
.chips button{border:0;border-radius:99px;padding:9px 16px;font-size:15px;font-weight:700;background:#ffffff26;color:#fff}
.chips button.on{background:var(--cream);color:var(--g)}
h2{font-size:23px;font-weight:800;margin:20px 0 2px}
.sub{color:var(--mut);font-size:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role{background:var(--w);border:2px solid var(--line);border-radius:20px;padding:16px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:17px;font-weight:700;color:var(--ink);position:relative}
.role .ib{width:58px;height:58px;border-radius:16px;display:grid;place-items:center}
.role.on{border-color:var(--g);background:#f3f8f6}
.role.on::after{content:"✓";position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--g);color:#fff;font-size:13px;display:grid;place-items:center}
.cta{width:100%;border:0;background:var(--g);color:#fff;font-size:18px;font-weight:800;padding:16px;border-radius:16px;margin-top:16px}
.note{display:flex;gap:6px;justify-content:center;align-items:center;color:var(--mut);font-size:13px;margin-top:12px}
/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0 10px}
.loc{font-size:13px;color:var(--mut);display:flex;gap:4px;align-items:center}
.top h1{font-size:22px;font-weight:800}
.bell{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--w);display:grid;place-items:center;position:relative;color:var(--g)}
.bell i{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;font-family:inherit;font-weight:700;font-size:11px;font-style:normal;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;border:2px solid var(--cream)}
.dng{background:var(--red);color:#fff;border-radius:24px;padding:20px;margin-top:4px}
.dng .t{display:flex;gap:8px;align-items:center;font-weight:700;font-size:15px}
.dng .big{font-size:34px;font-weight:800;margin:10px 0 4px;line-height:1.2}
.dng p{font-size:16px;line-height:1.5}
.dng .row{display:flex;gap:10px;margin-top:14px}
.dng .row button{flex:1;border:0;border-radius:14px;padding:13px 6px;font-size:15px;font-weight:800;background:#fff;color:var(--red)}
.dng .row button.v{flex:0 0 52px;background:#ffffff2e;color:#fff;display:grid;place-items:center}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.st div{background:var(--w);border:1.5px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center;font-size:13px;color:var(--mut)}
.st b{display:block;font-size:19px;color:var(--ink);margin-top:2px}
h3{font-size:16px;font-weight:800;margin:20px 0 10px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.d{flex:1 0 62px;background:var(--w);border-radius:16px;padding:10px 4px;text-align:center;font-size:13px;color:var(--mut);border:2px solid transparent}
.d.on{border-color:var(--red)}
.d b{display:block;font-size:17px;color:var(--ink);margin-top:6px}.d.on b{color:var(--red)}
.d .dot{display:block;margin:6px auto 0;width:12px;height:12px;border-radius:50%;border:3px solid var(--amb)}
.card{background:var(--w);border:1.5px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:10px;font-size:16px;font-weight:500;line-height:1.4;width:100%;text-align:left;color:var(--ink)}
.card .ib{flex:0 0 46px;height:46px;border-radius:12px;display:grid;place-items:center}
.sos{display:flex;gap:10px}
.sos button{flex:1;display:flex;gap:8px;align-items:center;justify-content:center;border:0;border-radius:14px;padding:13px 6px;font-size:15px;font-weight:700}
.sms{display:flex;gap:10px;align-items:center;background:var(--g2);border-radius:14px;padding:11px 12px;font-size:13.5px;color:var(--g);margin-top:12px;font-weight:600}
/* tabs */
.tabs{display:flex;background:var(--w);border-top:1.5px solid var(--line);padding:8px 6px 10px}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:600;color:var(--mut);padding:4px 0}
.tabs button.on{color:var(--g);font-weight:800}
/* notifications */
.nt{border-left:6px solid;padding:14px;border-radius:6px 16px 16px 6px;background:var(--w);margin-bottom:10px;display:block;width:100%;text-align:left;border-top:0;border-right:0;border-bottom:0;color:var(--ink)}
.nt b{font-size:16px;display:block}.nt span{font-size:14px;color:var(--mut);line-height:1.45;display:block;margin-top:2px}.nt em{font-style:normal;font-size:12.5px;color:var(--mut);display:block;margin-top:6px}
/* live alert */
.live{background:var(--dred);color:#fff;margin:0 -18px;padding:0 20px;flex:1;display:flex;flex-direction:column;min-height:100%}
.live .bar{display:flex;justify-content:space-between;align-items:center;padding:18px 0;font-size:13px}
.pill{display:flex;gap:8px;align-items:center;background:#ffffff26;padding:7px 12px;border-radius:99px;font-weight:700}
.pill s{width:9px;height:9px;border-radius:50%;background:#ff8a72;animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.pill s{animation:none}}
.live .mid{text-align:center;padding:12px 0}
.live .ring{width:86px;height:86px;border-radius:50%;background:#ffffff26;display:grid;place-items:center;margin:0 auto 14px}
.live h1{font-size:34px;line-height:1.25;font-weight:800;margin:6px 0 10px}
.live .mid p{font-size:16.5px;line-height:1.55}
.tm{display:inline-block;margin-top:10px;background:#0003;border-radius:12px;padding:6px 16px;font-size:26px;font-weight:800;letter-spacing:1px}
.sheet{background:#5a140d;margin:auto -20px 0;padding:18px 20px 20px;border-radius:26px 26px 0 0}
.sheet h4{font-size:15px;color:#f3c9c1;margin-bottom:10px}
.sheet li{list-style:none;display:flex;gap:12px;align-items:center;font-size:16px;margin-bottom:10px}
.sheet li b{flex:0 0 28px;height:28px;border-radius:50%;background:#fff;color:var(--dred);display:grid;place-items:center;font-size:15px}
.safe{width:100%;border:0;background:#fff;color:var(--dred);font-size:18px;font-weight:800;padding:15px;border-radius:16px;margin-top:6px}
.safe.ok{background:#2d7a4f;color:#fff}
.fam{text-align:center;font-size:13px;color:#e8bdb5;margin-top:10px}
/* guide */
.back{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--w);display:grid;place-items:center;color:var(--ink)}
.gt{display:flex;gap:12px;align-items:center;padding:16px 0}.gt h1{font-size:21px;font-weight:800}
.step{background:var(--w);border-radius:6px 16px 16px 6px;border-left:6px solid;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.step b{font-size:17px;display:block}.step span{font-size:14.5px;color:var(--mut)}
.warn{background:#fdefd9;border-radius:18px;padding:16px;font-size:16px;line-height:1.55}
.warn button{width:100%;margin-top:12px;border:0;background:var(--ink);color:#fff;font-size:16px;font-weight:800;padding:14px;border-radius:14px}
.ai{font-size:13px;color:var(--mut);margin:-6px 0 12px}

/* functional states only */
.cta:disabled{opacity:.7;cursor:default}
.card:disabled{opacity:.7}
</style></head>

// GPS gives ONLY latitude/longitude. Village names come from reverseGeocode().
function locationService(){
 return new Promise((resolve,reject)=>{
  if(!('geolocation' in navigator)){reject({code:'unsupported'});return}
  try{
   navigator.geolocation.getCurrentPosition(
    p=>resolve({lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy}),
    e=>reject({code:e&&e.code===1?'denied':e&&e.code===3?'timeout':'unavailable'}),
    {enableHighAccuracy:true,timeout:15000,maximumAge:60000});
  }catch(e){reject({code:'unavailable'})}
 });
}
// Prototype implementation: OpenStreetMap Nominatim (no API key; light demo use only).
// Replace this ONE function with your production geocoder later.
// Returns {village,taluka,district,state} or throws.
async function reverseGeocode(lat,lon,lang){
 if(!S.online)throw{code:'offline'};
 const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);
 try{
  const url='https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&addressdetails=1'
   +'&lat='+encodeURIComponent(lat)+'&lon='+encodeURIComponent(lon)+'&accept-language='+encodeURIComponent(lang+',en');
  const r=await fetch(url,{signal:ctl.signal});
  if(!r.ok)throw{code:'http'};
  const a=(await r.json()).address||{};
  const village=a.village||a.hamlet||a.town||a.suburb||a.neighbourhood||a.city||'';
  const taluka=a.county||a.city_district||a.subdistrict||'';
  const district=a.state_district||a.district||'';
  if(!village&&!taluka)throw{code:'noname'};
  return{village,taluka,district,state:a.state||''};
 }finally{clearTimeout(to)}
}

 const id=++S.ui.reqId,live=()=>S.ui.reqId===id;
 setUi({status:'detecting',msg:null,pending:null});
 // watchdog: some browsers never answer if the permission prompt is ignored
 const wd=setTimeout(()=>{if(live()){S.ui.reqId++;setUi({status:'error',msg:'e_timeout'})}},20000);
 try{
  const pos=await locationService();if(!live())return;
  let place;
  try{place=await reverseGeocode(pos.lat,pos.lon,S.lang)}
  catch(e){if(live())setUi({status:'error',msg:'e_name'});return}
  if(!live())return;
  setUi({status:'detected',pending:{...place,lat:pos.lat,lon:pos.lon,source:'gps'}});
 }catch(e){
  if(live())setUi({status:'error',msg:({denied:'e_denied',unsupported:'e_unsup',timeout:'e_timeout'})[e&&e.code]||'e_unavail'});
 }finally{clearTimeout(wd)}
}
function finishLocation(){const to=S.locReturn||'home';S.locReturn='home';nav(to)}
function confirmLocation(){if(!S.ui.pending)return;S.loc=S.ui.pending;finishLocation()}
function pickPlace(id){const p=GAZ.places.find(x=>x.id===id);if(!p)return;S.loc={placeId:id,lat:p.lat,lon:p.lon,source:'manual'};finishLocation()}
function changeLocation(){S.locReturn='prof';nav('loc')}
// helpers to read the stored location
function locParts(L){
 if(!L)return null;
 if(L.placeId){const p=GAZ.places.find(x=>x.id===L.placeId);return{name:p.name[S.lang],district:GAZ.district[S.lang],sub:GAZ.state[S.lang]}}
 const name=L.village||L.taluka;
 return{name,district:L.district||(L.taluka&&L.village?L.taluka:''),sub:[L.taluka&&L.village?L.taluka:'',L.district].filter(Boolean).join(' · ')}
}
function locLabel(){const p=locParts(S.loc);return p?[p.name,p.district].filter(Boolean).join(', '):t().nl}
function locDistrict(){const p=locParts(S.loc);return p?p.district:''}
function locCoords(){return S.loc&&S.loc.lat!=null?{lat:S.loc.lat,lon:S.loc.lon}:{lat:null,lon:null}}

/* ---------- WEATHER SERVICE ----------
   SAMPLE DATA ONLY. Not fetched from any weather API.
   Replace getWeatherData() with a real call later; nothing else needs to change.
   LAST-KNOWN WEATHER (this) is kept separate from OFFLINE SAFETY GUIDANCE (GUIDE above),
   which is bundled in the file and always available. */
const SAMPLE_WEATHER={source:'sample',asOf:null,tempC:45,humidity:38,windKmh:12,rainPct:0,localHour:14,
 daily:[45,44,39,36,41],cloudy:[false,false,true,true,false]};
function getWeatherData(lat,lon){return{...SAMPLE_WEATHER}}

/* ---------- ALERT SAMPLE (lightning) ---------- */
const ALERT={type:'lightning',minutes:45,source:'sample'};

/* ---------- SAFETY ENGINE (rules decide the hazard; text only explains) ----------
   Demo thresholds, designed to be replaced by a proper rules engine. */
const LEVELS=['low','moderate','high','very_high','extreme'];
function safetyEngine({weather:w,role,activity}){
 let lv=w.tempC>=45?4:w.tempC>=41?3:w.tempC>=38?2:w.tempC>=35?1:0;
 const reasons=[];if(lv>=1)reasons.push('temperature');
 if(w.humidity>=60&&lv>=1&&lv<4){lv++;reasons.push('humidity')}
 const midday=w.localHour>=11&&w.localHour<=16;
 const outdoor=role===0||role===1||role===3||['field_work','irrigation','machinery','travelling','animal_care'].includes(activity);
 if(midday&&outdoor&&lv>=1&&lv<4){lv++;reasons.push('midday_outdoor')}
 // NOTE: alert/guide text exists for the heat hazard; the sample data always triggers it.
 return{hazard:'heat',level:LEVELS[lv],levelIndex:lv,reasons};
}

/* ---------- GUIDANCE SERVICE ---------- */
function guidanceService(risk,role,lang){return GUIDE[lang][role]}
function view(){
 const c=locCoords(),w=getWeatherData(c.lat,c.lon),risk=safetyEngine({weather:w,role:S.role,activity:S.activity});
 return{w,risk,g:guidanceService(risk,S.role,S.lang)};
}

/* ---------- VOICE SERVICE ---------- */
function say(){
 try{
  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined')return;
  const{w,g}=view(),u=new SpeechSynthesisUtterance(t().now.replace('{t}',w.tempC)+'. '+g.adv);
  u.lang=VOICE[S.lang];
  speechSynthesis.cancel();speechSynthesis.speak(u);
 }catch(e){}
}
function stopVoice(){try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}}

/* ---------- ACTIONS ---------- */
function openHealthCentres(){
 const c=locCoords(),q='primary health centre near '+(c.lat!=null?c.lat+','+c.lon:locLabel());
 try{window.open('https://www.google.com/maps/search/'+encodeURIComponent(q),'_blank','noopener')}catch(e){}
}
function markSafe(){if(S.safe)return;S.safe=true;draw()} // simulated: no SMS / notification is sent
function remaining(){return Math.max(0,Math.floor((S.alertEnd-Date.now())/1000))}
const fmtTime=s=>N(String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0'));
function nav(s){
 if(s==='live'&&!S.alertEnd)S.alertEnd=Date.now()+ALERT.minutes*60000;
 if(s==='loc'){S.ui.reqId++;S.ui={status:'idle',msg:null,pending:null,reqId:S.ui.reqId}}
 if(s!==S.screen)stopVoice();
 S.screen=s;draw();
}
function setLang(l){S.lang=l;document.documentElement.lang=l;draw()}
function setRole(i){S.role=i;draw()}

/* ---------- ICONS ---------- */
const P={bell:'<path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 0 0 4 0"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',home:'<path d="M3 11l9-8 9 8M5 9.5V21h5v-6h4v6h5V9.5"/>',cow:'<path d="M5 8a3 3 0 0 1-2-3M19 8a3 3 0 0 0 2-3M6 8h12l1 6a4 4 0 0 1-4 5H9a4 4 0 0 1-4-5zM9 13v1M15 13v1"/>',warn:'<path d="M12 3l10 18H2zM12 10v5M12 18v.5"/>',book:'<path d="M5 3h13v18H7a2 2 0 0 1-2-2zM5 19a2 2 0 0 1 2-2h11"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',pin:'<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2"/>',spk:'<path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6"/>',phone:'<path d="M5 3h4l2 5-2 1a11 11 0 0 0 6 6l1-2 5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/>',back:'<path d="M15 5l-7 7 7 7"/>',shield:'<path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"/>',msg:'<path d="M4 5h16v11H9l-5 4z"/>',cloud:'<path d="M7 18a4 4 0 0 1 0-8 5 5 0 0 1 10 1 3.5 3.5 0 0 1 0 7z"/>'};
const ic=(n,s)=>`<svg class="svg" viewBox="0 0 24 24" ${s?`style="width:${s}px;height:${s}px"`:''}>${P[n]}</svg>`;
const RI=[['sun','#fdecc8','#d99a14'],['drop','#e3eeea','#1f4f4b'],['home','#f1e6e0','#b4573b'],['cow','#ece4f1','#7a5190']];

/* ---------- VIEWS ---------- */
function tabs(a){const d=t().tb,k=[['home','home'],['warn','alerts'],['book','guide'],['user','prof']];
 return k.map((x,i)=>`<button class="${a===x[1]?'on':''}" onclick="nav('${x[1]}')">${ic(x[0])}<span>${d[i]}</span></button>`).join('')}
function topbar(){return `<div class="top"><div><div class="loc">${ic('pin',14)} ${locLabel()}</div><h1>${t().hi}${t().r[S.role]}</h1></div><button class="bell" aria-label="${t().nt}" onclick="nav('alerts')">${ic('bell',24)}<i>${N(2)}</i></button></div>`}
function hd(){return `<div class="hd"><div class="brand">${ic('sun',34)}ऋतु सजग</div><p>Rutu Sajag</p><div class="chips">${['mr','hi','en'].map(l=>`<button class="${S.lang===l?'on':''}" onclick="setLang('${l}')">${LN[l]}</button>`).join('')}</div></div>`}
function onb(){return hd()+`
<h2>${t().q}</h2><div class="sub">${t().qs}</div><div class="grid">${t().r.map((r,i)=>`<button class="role ${S.role===i?'on':''}" onclick="setRole(${i})"><span class="ib" style="background:${RI[i][1]};color:${RI[i][2]}">${ic(RI[i][0],30)}</span>${r}</button>`).join('')}</div>
<button class="cta" onclick="nav('loc')">${t().go}</button><div class="note">${ic('shield',16)} ${t().loc}</div>`}
function loc(){
 const x=t(),u=S.ui;let main='';
 if(u.status==='detected'&&u.pending){
  const p=locParts(u.pending);
  main=`<div class="card"><span class="ib" style="background:#e3eeea;color:#1f4f4b">${ic('pin',26)}</span><div><b>${p.name}</b><div style="font-size:14px;color:var(--mut)">${p.sub||p.district}</div></div></div><button class="cta" style="margin-top:0" onclick="confirmLocation()">${x.lc}</button>`;
 }else{
  const busy=u.status==='detecting';
  main=`<button class="cta" style="margin-top:0" ${busy?'disabled aria-busy="true"':''} onclick="useMyLocation()">${busy?x.ld:x.lu}</button>`
   +(busy?`<div class="sms">${ic('pin',22)} ${x.lhint}</div>`:'')
   +(u.status==='error'?`<div class="warn" style="font-size:14.5px;margin-top:12px" role="alert">${x[u.msg]}</div>`:'');
 }
 return hd()+`<h2>${x.lq}</h2><div class="sub">${x.lqs}</div>${main}
<h3>${x.lm}</h3><div class="sub" style="margin-bottom:10px">${GAZ.state[S.lang]} › ${GAZ.district[S.lang]}</div>`
 +GAZ.places.map(p=>`<button class="card" onclick="pickPlace('${p.id}')"><span class="ib" style="background:#e3eeea;color:#1f4f4b">${ic('pin',24)}</span>${p.name[S.lang]}</button>`).join('')}
function home(){const x=t(),{w,g}=view();
 return topbar()+`<div class="dng"><div class="t">${ic('warn',24)} ${x.tag}</div><div class="big">${x.now.replace('{t}',N(w.tempC))}</div><p>${g.adv}</p><div class="row"><button onclick="nav('guide')">${x.full}</button><button class="v" aria-label="Read aloud" onclick="say()">${ic('spk',24)}</button></div></div>
<div class="st"><div>${x.hum}<b>${N(w.humidity)}%</b></div><div>${x.wnd}<b>${N(w.windKmh)} km/h</b></div><div>${x.rn}<b>${N(w.rainPct)}%</b></div></div>
<h3>${x.n5}</h3><div class="days">${w.daily.map((v,i)=>`<div class="d ${i?'':'on'}">${x.dy[i]}${w.cloudy[i]?`<span style="display:block;margin-top:4px;color:var(--mut)">${ic('cloud',20)}</span>`:'<span class="dot"></span>'}<b>${N(v)}°</b></div>`).join('')}</div>
<h3>${x.care}</h3><div class="card"><span class="ib" style="background:#fdecc8;color:#d99a14">${ic('sun',26)}</span>${g.c1}</div><div class="card"><span class="ib" style="background:#e3eeea;color:#1f4f4b">${ic('drop',26)}</span>${g.c2}</div>
<div class="sos"><button style="background:var(--red);color:#fff" onclick="location.href='tel:108'">${ic('phone',20)} ${N(108)}</button><button style="background:var(--g2);color:var(--g)" onclick="openHealthCentres()">${ic('pin',20)} ${x.hc}</button></div>
<div class="sms">${ic('msg',22)} ${x.sms}</div>`}
function alerts(){const c=['var(--dred)','var(--red)','var(--g)'],a=['live','guide','alerts'];
 return `<div class="top"><h1>${t().nt}</h1></div>`+t().n.map((n,i)=>`<button class="nt" style="border-left-color:${c[i]}" onclick="nav('${a[i]}')"><b>${n[0]}</b><span>${n[1]}</span><em>${n[2]}</em></button>`).join('')}
function live(){const x=t();
 return `<div class="live"><div class="bar"><span class="pill"><s></s>DEMO ALERT</span><span>${locDistrict()}</span></div><div class="mid"><div class="ring">${ic('bolt',46)}</div><div style="font-size:14px;letter-spacing:.5px;color:#f3c9c1;font-weight:700">${x.lt}</div><h1>${x.lh}</h1><p>${x.lb}</p><span class="tm" id="tm">${fmtTime(remaining())}</span></div>
<div class="sheet"><h4>${x.lw}</h4><ul style="padding:0">${x.ls.map((s,i)=>`<li><b>${N(i+1)}</b>${s}</li>`).join('')}</ul><button class="safe ${S.safe?'ok':''}" onclick="markSafe()">${S.safe?x.sd:x.sf}</button><div class="fam">${S.safe?x.fm2:x.fm}</div></div></div>`}
function guide(){const x=t(),{w,g}=view(),c=['var(--red)','var(--g)','var(--amb)'];
 return `<div class="gt"><button class="back" aria-label="Back" onclick="nav('home')">${ic('back')}</button><h1>${x.gt}</h1></div><div class="card" style="margin-bottom:6px"><span class="ib" style="background:#fdecc8;color:#d99a14">${ic('sun',28)}</span><div><b>${x.gs.replace('{t}',N(w.tempC)).replace('{r}',x.r[S.role])}</b></div></div><div class="ai">${x.ai}</div>
<h3 style="color:var(--mut)">${x.gn}</h3>${g.g.map((s,i)=>`<div class="step" style="border-left-color:${c[i]}"><span style="color:${c[i]}">${ic(s[0],28)}</span><div><b>${s[1]}</b><span>${s[2]}</span></div></div>`).join('')}
<h3 style="color:var(--mut)">${x.sy}</h3><div class="warn">${x.sb}<button onclick="openHealthCentres()">${x.hcs}</button></div>`}
function prof(){const x=t();
 return `<div class="top"><h1>${x.tb[3]}</h1></div>`+x.pf.map((f,i)=>{
  const val=i==0?locLabel():i==1?x.r[S.role]:i==2?LN[S.lang]:x.pv[i];
  const inner=`<span style="color:var(--mut);font-size:14px">${f}</span><b>${val}</b>`;
  return i==0?`<button class="card" style="justify-content:space-between" onclick="changeLocation()">${inner}</button>`
              :`<div class="card" style="justify-content:space-between">${inner}</div>`}).join('')
 +`<div class="chips" style="margin-top:6px">${['mr','hi','en'].map(l=>`<button style="background:${S.lang===l?'var(--g)':'var(--g2)'};color:${S.lang===l?'#fff':'var(--g)'}" onclick="setLang('${l}')">${LN[l]}</button>`).join('')}</div>`}

/* ---------- RENDER ---------- */
const D=[['onb','Onboarding'],['loc','Location'],['home','Home'],['alerts','Notifications'],['live','Live alert'],['guide','Heat guide']];
const VIEWS={onb,loc,home,alerts,live,guide,prof};
function draw(){
 const s=document.getElementById('scr');
 s.innerHTML=VIEWS[S.screen]();
 s.style.paddingBottom=S.screen=='live'?0:'';
 if(S.screen!==lastScr)s.scrollTop=0;
 lastScr=S.screen;
 const tb=document.getElementById('tabs'),show=!['onb','loc','live'].includes(S.screen);
 tb.style.display=show?'flex':'none';tb.innerHTML=show?tabs(S.screen):'';
 document.getElementById('dev').innerHTML=D.map(d=>`<button class="${S.screen==d[0]?'on':''}" onclick="nav('${d[0]}')">${d[1]}</button>`).join('');
 // countdown only runs on the live-alert screen and stops once marked safe
 clearInterval(tick);tick=null;
 if(S.screen=='live'&&!S.safe){
  tick=setInterval(()=>{
   const e=document.getElementById('tm');
   if(!e||S.screen!=='live'){clearInterval(tick);tick=null;return}
   e.textContent=fmtTime(remaining());
  },1000);
 }
}
window.addEventListener('online',()=>{S.online=true});
window.addEventListener('offline',()=>{S.online=false});
document.documentElement.lang=S.lang;
draw();
</script></body></html>
